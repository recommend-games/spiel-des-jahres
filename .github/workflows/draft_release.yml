name: Draft a release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version number (e.g. 1.2.3) OR one of: patch|minor|major|alpha|beta|rc'
        required: true
        default: 'patch'

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-uv-env
      - name: Update version
        id: updated_version
        shell: bash
        run: |
          INPUT="${{ github.event.inputs.version }}"
          if [[ "$INPUT" =~ ^(major|minor|patch|alpha|beta|rc)$ ]]; then
            uv version --bump "$INPUT"
          else
            uv version "$INPUT"
          fi
          version=$(uv version --short)
          echo "version=$version" >> $GITHUB_OUTPUT
      - name: Update changelog
        id: changelog
        shell: bash
        run: |
          uv run kacl-cli release ${{ steps.updated_version.outputs.version }} --modify --auto-link
          echo "" >> CHANGELOG.md
          body=$(uv run kacl-cli get ${{ steps.updated_version.outputs.version }})
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$body" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          add: 'CHANGELOG.md pyproject.toml uv.lock'
          message: 'Release ${{ steps.updated_version.outputs.version }}'
      - name: Create tag
        run: |
          git tag ${{ steps.updated_version.outputs.version }}
          git push origin ${{ steps.updated_version.outputs.version }}
      - name: Create a draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.updated_version.outputs.version }}
          name: Release ${{ steps.updated_version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
