[project]
name = "spiel-des-jahres"
version = "0.4.0"
description = "Spiel des Jahres predictions"
authors = [
    { name = "Markus Shepherd", email = "markus@recommend.games" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Documentation = "https://recommend-games.github.io/spiel-des-jahres"
Homepage = "https://recommend-games.github.io/spiel-des-jahres"
Repository = "https://github.com/recommend-games/spiel-des-jahres"

[project.optional-dependencies]
kennerspiel = [
    "funcy>=2.0.0,<3.0.0",
    "joblib>=1.0.0,<2.0.0",
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.0.0,<3.0.0",
    "polars[pandas,pyarrow]>=1.0.0,<2.0.0",
    "scikit-learn>=1.0.0,<2.0.0",
    "scipy>=1.0.0,<2.0.0",
]
predictions = [
    "board-game-recommender>=4.0.0,<5.0",
    "funcy>=2.0.0,<3.0.0",
    "joblib>=1.0.0,<2.0.0",
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.0.0,<3.0.0",
    "polars[pandas,pyarrow]>=1.0.0,<2.0.0",
    "scikit-learn>=1.0.0,<2.0.0",
    "scipy>=1.0.0,<2.0.0",
    "tqdm",
]
scraper = [
    "beautifulsoup4>=4.12.0,<5.0",
    "openai>=1.0.0,<2.0.0",
    "pydantic>=2.0.0",
    "polars[pandas,pyarrow]>=1.0.0,<2.0.0",
    "python-levenshtein>=0.27.3",
    "scrapy>=2.11.0,<3.0",
    "thefuzz>=0.22.1",
]

[dependency-groups]
dev = [
    "funcy-typing",
    "ipython",
    "jupyter-black",
    "jupyterlab",
    "jupytext",
    "mkdocstrings[python]>=0.23",
    "mkdocs-material",
    "mypy",
    "pandas-stubs",
    "pre-commit",
    "pymdown-extensions",
    "pytest",
    "pytest-github-actions-annotate-failures",
    "pytest-cov",
    "python-kacl",
    "ruff>=0.2.0",
    "scipy-stubs",
    "types-requests",
    "types-tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spiel_des_jahres"]

[tool.hatch.build.targets.sdist]
include = ["src/spiel_des_jahres/data/"]

[tool.ruff]
target-version = "py310" # The lowest supported version
exclude = ["notebooks"]

[tool.ruff.lint]
# By default, enable all the lint rules.
# Add to the ignore list below if you don't want some rules.
# If you need some ignores for certain modules, see tool.ruff.lint.per-file-ignores below.
# For individual ignore cases, prefer inline `# noqa`s within the code.
select = ["ALL"]
ignore = [
    "ANN",      # Type hints related, let mypy handle these.
    "D",        # Docstrings related, way too strict to our taste
    "TD",
    "FIX",
    "EM102",    # Exception must not use an f-string literal, assign to variable first
    "T201",     # `print` found
    "TRY003",   # Avoid specifying long messages outside the exception class
    "BLE001",
    "ERA001",
    "RUF001",
    "ISC003",
    "S101",     # "Use of `assert` detected"
    "DTZ011",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # "Use of `assert` detected"
    "ARG",      # "Unused function argument". Fixtures are often unused.
    "S105",     # "Possible hardcoded password".
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "classmethod",
    "pydantic.validator",
    "pydantic.root_validator",
]

[tool.ruff.lint.pylint]
max-args = 20

[tool.pytest.ini_options]
addopts = """\
    --cov spiel_des_jahres \
    --cov tests \
    --cov-report term-missing \
    --no-cov-on-fail \
"""

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    'if TYPE_CHECKING:',
    'pragma: no cover'
]

[tool.mypy]
# This is the global mypy configuration.
# Avoid changing this!
strict = true  # See all the enabled flags `mypy --help | grep -A 10 'Strict mode'`
# disallow_any_unimported = true
exclude = [
    '^notebooks/*',
]

# If you need to ignore something for some specific module,
# add overrides for them. Avoid changing the global config!
# For example:
[[tool.mypy.overrides]]
module = ["joblib.*", "sklearn.*"]
ignore_missing_imports = true
